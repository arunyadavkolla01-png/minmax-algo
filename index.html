<!DOCTYPE html>
<html>
<head>
  <title>AI Games</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body class="text-white flex flex-col items-center p-6">

<h1 class="text-3xl mb-4">AI Games</h1>

<div class="flex gap-4 mb-6">
  <button onclick="show('tic')" class="btn">Tic Tac Toe</button>
  <button onclick="show('puzzle')" class="btn">8 Puzzle</button>
</div>

<!-- TIC TAC TOE -->
<div id="ticGame" class="glass p-6">
  <h2 class="mb-3">Tic Tac Toe</h2>
  <div id="board" class="grid grid-cols-3 gap-2"></div>
  <p id="status" class="mt-3"></p>
  <button onclick="resetTic()" class="btn mt-3">Reset</button>
</div>

<!-- PUZZLE -->
<div id="puzzleGame" class="glass p-6 hidden">
  <h2 class="mb-3 text-center">8 Puzzle Solver</h2>

  <div class="flex gap-6">

    <div>
      <div id="puzzleBoard" class="grid grid-cols-3 gap-2"></div>

      <div class="mt-4 flex gap-2 justify-center">
        <button onclick="shuffle()" class="btn">Shuffle</button>
        <button onclick="resetPuzzle()" class="btn">Reset</button>
        <button onclick="solveBFS()" class="btn">BFS</button>
        <button onclick="solveAstar()" class="btn">A*</button>
      </div>

      <p id="steps" class="mt-3 text-center"></p>
    </div>

    <div id="trace" class="text-sm max-h-80 overflow-auto w-64"></div>

  </div>
</div>
<!-- add this button to the switch area -->
<button onclick="show('sudoku')" class="btn">Sudoku</button>

<!-- SUDOKU -->
<div id="sudokuGame" class="glass p-6 hidden">
  <h2 class="mb-3 text-center">Sudoku</h2>

  <div class="flex gap-6">
    <div>
      <div id="sudokuBoard" class="grid grid-cols-9 gap-1"></div>

      <div class="mt-4 flex gap-2 justify-center">
        <button onclick="clearSudoku()" class="btn">Clear</button>
        <button onclick="validateSudoku()" class="btn">Validate</button>
        <button onclick="solveSudokuUI()" class="btn">Solve</button>
        <button onclick="generateSudoku()" class="btn">Generate</button>
      </div>

      <p id="sudokuStatus" class="mt-3 text-center"></p>
    </div>

    <div id="sudokuTrace" class="text-sm max-h-80 overflow-auto w-64"></div>
  </div>
</div>

<!-- POPUP -->
<div id="popup" class="fixed inset-0 hidden items-center justify-center bg-black/60">
  <div class="glass p-6 text-center">
    <p id="popupText" class="text-lg mb-3"></p>
    <button onclick="closePopup()" class="btn">OK</button>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
